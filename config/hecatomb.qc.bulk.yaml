# Hecatomb v1.1.0 config -- QC (preprocessing stage) for the BULK jackalope cohort
#
# Differs from the VLP run only in the input/output paths. Same filtering
# parameters, so the two QC tables are directly comparable -- which is the point:
# the VLP cohort loses ~1.4% of reads to host removal, this one should lose ~40%.

Reads: /scratch/sahlab/leran/jackalope_bulk/READS
Output: /scratch/sahlab/leran/jackalope_bulk/qc_hecatomb
Host: human
Preprocess: paired
Search: fast
Databases: null

# --- read filtering ---
QSCORE: 15
READ_MINLENGTH: 90
CUTTAIL_WINDOW: 25
DEDUP_ACCURACY: 4
COMPRESSION: 1
ENTROPY: 0.5
ENTROPYWINDOW: 25
CONTIG_MINLENGTH: 1000

# --- clustering (dereplication) ---
linclustParams: --kmer-per-seq-scale 0.3 -c 0.8 --cov-mode 1 --min-seq-id 0.97 --alignment-mode
  3

# --- resources ---
# Bumped over the VLP run: these samples carry ~100x more non-viral material,
# so host_removal_mapping and the clustering step both see far more input.
BigJobCpu: 16
BigJobMem: 120000
BigJobTimeMin: 2-0
MediumJobCpu: 16
MediumJobMem: 80000
SmallJobCpu: 8
SmallJobMem: 40000
MoreRamCpu: 8
MoreRamMem: 80000

# --- search params (unused by the preprocessing stage, kept for config validity) ---
filtAAprimary: --min-length 30 -e 1e-3
filtAAsecondary: --min-length 30 -e 1e-5
filtNTprimary: --min-length 90 -e 1e-10
filtNTsecondary: --min-length 90 -e 1e-20
perfAA: --start-sens 1 --sens-steps 3 -s 7 --lca-mode 2 --shuffle 0
perfAAfast: -s 4.0 --lca-mode 2 --shuffle 0
perfNT: --start-sens 2 -s 7 --sens-steps 3
perfNTfast: -s 4.0
taxIdIgnore: 0 1 2 10239 131567 12429 2759
canuSettings: correctedErrorRate=0.16 maxInputCoverage=10000 minInputCoverage=0 corOutCoverage=10000
  corMhapSensitivity=high corMinCoverage=0 useGrid=False stopOnLowCoverage=False genomeSize=10M
  -nanopore
